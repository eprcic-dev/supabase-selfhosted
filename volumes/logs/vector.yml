api:
  enabled: true
  address: 0.0.0.0:9001

sources:
  docker_host:
    type: docker_logs
    exclude_containers:
      - supabase-vector

transforms:
  project_logs:
    type: remap
    inputs:
      - docker_host
    source: |-
      .project = "default"
      .event_message = del(.message)
      .appname = del(.container_name)
      del(.container_created_at)
      del(.container_id)
      del(.source_type)
      del(.stream)
      del(.label)
      del(.image)
      del(.host)
      del(.timestamp)

  router:
    type: route
    inputs:
      - project_logs
    route:
      kong: '.appname == "supabase-kong"'
      auth: '.appname == "supabase-auth"'
      rest: '.appname == "supabase-rest"'
      realtime: '.appname == "realtime-dev.supabase-realtime"'
      storage: '.appname == "supabase-storage"'
      functions: '.appname == "supabase-functions"'
      db: '.appname == "supabase-db"'

sinks:
  logflare_auth:
    type: "http"
    inputs:
      - "router.auth"
    uri: "http://analytics:4000/api/logs?source_name=gotrue.logs.prod&api_key=${LOGFLARE_API_KEY}"
    method: "post"
    payload_prefix: ""
    encoding:
      codec: "json"
    batch:
      max_bytes: 1049000
    buffer:
      type: memory
      max_events: 500

  logflare_rest:
    type: "http"
    inputs:
      - "router.rest"
    uri: "http://analytics:4000/api/logs?source_name=postgREST.logs.prod&api_key=${LOGFLARE_API_KEY}"
    method: "post"
    payload_prefix: ""
    encoding:
      codec: "json"
    batch:
      max_bytes: 1049000
    buffer:
      type: memory
      max_events: 500

  logflare_db:
    type: "http"
    inputs:
      - "router.db"
    uri: "http://analytics:4000/api/logs?source_name=postgres.logs&api_key=${LOGFLARE_API_KEY}"
    method: "post"
    payload_prefix: ""
    encoding:
      codec: "json"
    batch:
      max_bytes: 1049000
    buffer:
      type: memory
      max_events: 500

  logflare_realtime:
    type: "http"
    inputs:
      - "router.realtime"
    uri: "http://analytics:4000/api/logs?source_name=realtime.logs.prod&api_key=${LOGFLARE_API_KEY}"
    method: "post"
    payload_prefix: ""
    encoding:
      codec: "json"
    batch:
      max_bytes: 1049000
    buffer:
      type: memory
      max_events: 500

  logflare_storage:
    type: "http"
    inputs:
      - "router.storage"
    uri: "http://analytics:4000/api/logs?source_name=storage.logs.prod.2&api_key=${LOGFLARE_API_KEY}"
    method: "post"
    payload_prefix: ""
    encoding:
      codec: "json"
    batch:
      max_bytes: 1049000
    buffer:
      type: memory
      max_events: 500

  logflare_kong:
    type: "http"
    inputs:
      - "router.kong"
    uri: "http://analytics:4000/api/logs?source_name=cloudflare.logs.prod&api_key=${LOGFLARE_API_KEY}"
    method: "post"
    payload_prefix: ""
    encoding:
      codec: "json"
    batch:
      max_bytes: 1049000
    buffer:
      type: memory
      max_events: 500

  logflare_functions:
    type: "http"
    inputs:
      - "router.functions"
